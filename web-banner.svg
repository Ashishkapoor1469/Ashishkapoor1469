<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3b0a0a"/>
      <stop offset="55%" stop-color="#160303"/>
      <stop offset="100%" stop-color="#050000"/>
    </radialGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2f2f"/>
      <stop offset="100%" stop-color="#8f0d0d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- radial web strands from top-left corner -->
  <g stroke="url(#strand)" stroke-width="1.4" opacity="0.55" filter="url(#glow)">
    <line x1="-40" y1="-40" x2="1240" y2="120"/>
    <line x1="-40" y1="-40" x2="1000" y2="300"/>
    <line x1="-40" y1="-40" x2="760" y2="300"/>
    <line x1="-40" y1="-40" x2="520" y2="300"/>
    <line x1="-40" y1="-40" x2="280" y2="300"/>
    <line x1="-40" y1="-40" x2="40" y2="300"/>
    <line x1="-40" y1="-40" x2="1240" y2="-10"/>
  </g>
  <!-- radial web strands from top-right corner -->
  <g stroke="url(#strand)" stroke-width="1.4" opacity="0.55" filter="url(#glow)">
    <line x1="1240" y1="-40" x2="-40" y2="140"/>
    <line x1="1240" y1="-40" x2="200" y2="300"/>
    <line x1="1240" y1="-40" x2="440" y2="300"/>
    <line x1="1240" y1="-40" x2="680" y2="300"/>
    <line x1="1240" y1="-40" x2="920" y2="300"/>
    <line x1="1240" y1="-40" x2="1160" y2="300"/>
  </g>

  <!-- concentric web arcs (spun from top-left) -->
  <g stroke="url(#strand)" stroke-width="1.1" fill="none" opacity="0.65">
    <path d="M -40,60 Q 300,140 640,60 T 1240,90"/>
    <path d="M -40,140 Q 300,240 640,150 T 1240,180"/>
    <path d="M -40,220 Q 300,320 640,230 T 1240,260"/>
  </g>

  <!-- corner spider silhouette (simple geometric shape, not licensed art) -->
  <g transform="translate(55,55)" opacity="0.9" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="10" ry="14" fill="#ff2f2f"/>
    <ellipse cx="0" cy="-16" rx="6" ry="6" fill="#ff2f2f"/>
    <g stroke="#ff2f2f" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-4" x2="-22" y2="-14"/>
      <line x1="0" y1="0"  x2="-26" y2="-2"/>
      <line x1="0" y1="6"  x2="-22" y2="16"/>
      <line x1="0" y1="-4" x2="22" y2="-14"/>
      <line x1="0" y1="0"  x2="26" y2="-2"/>
      <line x1="0" y1="6"  x2="22" y2="16"/>
    </g>
  </g>

  <!-- title text -->
  <text x="600" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#ffffff" filter="url(#glow)">ASHISH KAPOOR</text>
  <text x="600" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="20" letter-spacing="3" fill="#ff5050">YOUR FRIENDLY NEIGHBORHOOD FULL-STACK DEVELOPER</text>
</svg>
